[package]
name = "pico-template"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# ---------------------------------------------------------------------------
# Embassy is pinned to a `main` revision.
#
# The published embassy-* crates on crates.io lag behind `main` and have a
# different API (e.g. `Output<'d, PIN>` vs `Output<'d>`, different `PioSpi::new`
# / `Stack::new` signatures, `proto-ipv4` vs `ipv4`). This template follows the
# embassy examples, so it tracks the same revision.
#
# To update: pick a new commit from https://github.com/embassy-rs/embassy and
# replace every `rev` below with the same value.
# ---------------------------------------------------------------------------
[dependencies]
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "8573b7004382e061826699efb3491362a27d076f", features = ["defmt"] }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "8573b7004382e061826699efb3491362a27d076f", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-rp = { git = "https://github.com/embassy-rs/embassy", rev = "8573b7004382e061826699efb3491362a27d076f", features = [
    "defmt",
    "unstable-pac",
    "time-driver",
    "critical-section-impl",
    "rp2040",
    "executor-thread",
    "executor-interrupt",
] }
embassy-net = { git = "https://github.com/embassy-rs/embassy", rev = "8573b7004382e061826699efb3491362a27d076f", features = [
    "defmt",
    "tcp",
    "udp",
    "dhcpv4",
    "medium-ethernet",
    "ipv4",
] }
cyw43 = { git = "https://github.com/embassy-rs/embassy", rev = "8573b7004382e061826699efb3491362a27d076f", features = ["defmt", "firmware-logs"] }
cyw43-pio = { git = "https://github.com/embassy-rs/embassy", rev = "8573b7004382e061826699efb3491362a27d076f", features = ["defmt"] }
# USB CDC used only to implement the 1200-baud BOOTSEL reset (src/usb.rs).
embassy-usb = { git = "https://github.com/embassy-rs/embassy", rev = "8573b7004382e061826699efb3491362a27d076f", default-features = false, features = ["defmt"] }

defmt = "1.0.1"
defmt-rtt = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
static_cell = "2.1"
cortex-m-rt = "0.7"
critical-section = "1.1"
# Cortex-M0+ has no atomic CAS; provide it via critical sections.
portable-atomic = { version = "1.5", features = ["critical-section"] }

[build-dependencies]
toml = "0.8"

[profile.release]
debug = true
lto = true
opt-level = "s"
